<div class="row">
  <div class="col">
    <div class="alert alert-warning">
      {{ date() | date : "full" | uppercase }}
    </div>
    <app-list [cvs]="cvs()"></app-list>
  </div>
  <div class="col">
    @if (selectedCv(); as cv) {
      <app-cv-card [cv]="cv"></app-cv-card>
    } @else {
      <app-cv-card [cv]="null"></app-cv-card>
    }
  </div>
</div>
