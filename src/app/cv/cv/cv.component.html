<div class="row">
  <div class="col">
    <div class="alert alert-warning">
      {{ date | date : "full" | uppercase }}
    </div>
    <app-list [cvs]="cvs()"></app-list>
  </div>
  <div class="col">
    <app-cv-card [cv]="selectedCv()"></app-cv-card>
  </div>
</div>

@defer (on interaction) {
  <app-embauche></app-embauche>
} @placeholder {
  <div class="text-center p-3">
    <p class="text-muted">Chargement du composant embauche...</p>
  </div>
} @loading (minimum 30s) {
  <div class="text-center p-3">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>
}
