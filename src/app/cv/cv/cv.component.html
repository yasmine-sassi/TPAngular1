<div class="row">
  <div class="col">
    <div class="alert alert-warning">
      {{ date | date: "full" | uppercase }}
    </div>

    <!-- Pass Observable data using async -->
    <app-list 
      [cvs]="cvs$ | async" 
      (selectCvEvent)="selectCv($event)">
    </app-list>
  </div>

  <div class="col">
    <!-- Show selected CV using async -->
    <app-cv-card [cv]="selectedCv$ | async"></app-cv-card>
  </div>
</div>

<app-embauche></app-embauche>
