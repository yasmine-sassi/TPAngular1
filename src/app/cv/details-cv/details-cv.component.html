<div class="d-flex justify-content-center" *ngIf="cv$ | async as cv; else loading">
  <div class="col-lg-8 push-lg-4">
    <div class="tab-content p-b-3">
      <div class="tab-pane active" id="profile">
        <!-- No back button - user can click another CV in the list -->
        <h4 class="m-y-2">Cv {{ cv.firstname }} {{ cv.name }}</h4>
        <div class="d-flex justify-content-center">
          <img width="150px" height="150px" class="rounded-circle align-content-center"
               src="assets/images/{{ cv.path | defaultImage }}" alt="{{ cv.name }}" />
        </div>
        <div class="row">
          <div class="col-md-12">
            <h4 class="m-t-2">
              <span class="fa fa-clock-o ion-clock pull-xs-right"></span>
              Informations
            </h4>
            <table class="table table-hover table-striped">
              <tbody>
                <tr><td><strong>Name</strong> {{ cv.name }}</td></tr>
                <tr><td><strong>Firstname</strong> {{ cv.firstname }}</td></tr>
                <tr><td><strong>Job</strong> {{ cv.job }}</td></tr>
                <tr><td><strong>Age</strong> {{ cv.age }}</td></tr>
                <tr><td><strong>Cin</strong> {{ cv.cin }}</td></tr>
              </tbody>
            </table>
            <div class="d-flex justify-content-center">
              <button *ngIf="authService.isAuthenticated()" 
                      (click)="deleteCv(cv)" 
                      class="btn btn-danger">
                Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #loading>
  <div class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>
</ng-template>
