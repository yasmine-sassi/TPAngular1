<!-- list.component.html -->
<div class="cv-list">
  @for (cv of cvs(); track cv.id) {
    <div 
      class="cv-item" 
      [class.selected]="selectedCvId() === cv.id"
      (click)="onCvSelect(cv)"
    >
      <app-item [cv]="cv"></app-item>
    </div>
  } @empty {
    <div class="empty-list">Aucun CV trouvé</div>
  }
</div>
