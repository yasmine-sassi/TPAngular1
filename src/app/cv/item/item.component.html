<!-- item.component.html -->
<div class="cv-item-container">
  <img 
    [src]="'assets/images/' + (cv().path | defaultImage)" 
    [alt]="cv().name"
    class="cv-thumbnail">
  <div class="cv-item-info">
    <h6 class="cv-name">{{ cv().firstname }} {{ cv().name }}</h6>
    <p class="cv-job">
      <i class="fa fa-briefcase"></i> {{ cv().job }}
    </p>
    <small class="cv-age">
      <i class="fa fa-calendar"></i> {{ cv().age }} ans
    </small>
  </div>
</div>
