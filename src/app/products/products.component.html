@if (products(); as productsList) {

  <button class="btn btn-primary" (click)="loadMore()">More Products</button>

  <div class="alert alert-warning">
    Product Number: {{ productsList.length }}
  </div>

  <div class="row">
    @for (product of productsList; track product) {
      <div class="col-4">
        <img
          class="rounded-circle"
          [src]="product.thumbnail"
          width="150"
          height="150"
        />
        {{ product.title }}
      </div>
    }
  </div>

} @else {
  Loading...
}
